name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包 exe
        run: pyinstaller --noconfirm --clean --onefile --console --name jm-downloader --collect-all jmcomic main.py

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: jm-downloader-exe
          path: dist/jm-downloader.exe

      - name: 发布 Release（推 tag 时触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jm-downloader.exe
          generate_release_notes: true
